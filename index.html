<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shears</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="tb-left" data-tauri-drag-region>
          <button class="icon-btn" id="btn-sidebar" data-tip="Toggle sidebar" data-key="Ctrl ." data-tip-pos="below"></button>
        </div>
        <div class="tb-title" id="title" data-tauri-drag-region>Shears</div>
        <div class="tb-actions" id="tb-actions"></div>
        <div class="win-controls">
          <button class="win-btn" id="win-min" aria-label="Minimize"></button>
          <button class="win-btn" id="win-max" aria-label="Maximize"></button>
          <button class="win-btn close" id="win-close" aria-label="Close"></button>
        </div>
      </header>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

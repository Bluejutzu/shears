name: Release

# Merging a version bump into main (see `bun run bump`) builds the installer and the signed
# updater files into a draft release for that version. Publishing the draft creates the
# vX.Y.Z tag and ships the update. Pushes that don't change the version do nothing.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and tags, for the release notes
          fetch-depth: 0

      - name: New version?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # a release (draft or not) or a tag for this version means it's already been built
          if gh release view "$tag" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already has a release, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # "What's new" is every commit since the last release, one line each. A squash merge
      # lists the PR's commits in its message, so those come out as lines too.
      - name: Release notes
        id: notes
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)
          range=HEAD
          [ -n "$prev" ] && range="$prev..HEAD"
          git log --no-merges --format='%s%n%b' "$range" \
            | sed -E 's/^[[:space:]]*[-*][[:space:]]+//; s/ \(#[0-9]+\)$//' \
            | grep -viE '^[[:space:]]*$|^release v|^co-authored-by|^signed-off-by|generated with' \
            | awk '!seen[$0]++' \
            | sed -E 's/^(.)/- \U\1/' > notes.md || true
          [ -s notes.md ] || echo "- Fixes and small improvements" > notes.md
          cat notes.md
          { echo 'list<<NOTES_END'; cat notes.md; echo 'NOTES_END'; } >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2

      - if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - if: steps.version.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # the public identity ("Shears") on top of the local "Shears Dev" config
          args: --config src-tauri/tauri.release.conf.json
          # the tag is made from this commit when the draft gets published
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Shears ${{ steps.version.outputs.tag }}
          releaseBody: |
            ## What's new

            ${{ steps.notes.outputs.list }}

            Download **Shears_*_x64-setup.exe** below. Shears updates itself from here on.
          releaseDraft: true
          includeUpdaterJson: true
